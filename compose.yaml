services:
  cron-runner:
    build: cron-runner
    container_name: fogcast-cron-runner
    restart: always
    depends_on:
      - "fogcast-influxdb"
    volumes:
      - type: bind
        source: ./csv-data
        target: /app/csv-data
      - type: bind
        source: ./cron-logs
        target: /app/logs
      - type: bind
        source: ./cron-runner/config/models
        target: /app/config/models
        read_only: true
    networks:
      - default
      - proxy-net
          #networks:
          #- proxy-net

  status-reporter:
    build: cron-status
    container_name: fogcast-status-reporter
    restart: always
    depends_on:
      - cron-runner
    volumes:
      - type: bind
        source: ./cron-logs
        target: /app/logs
    environment:
      - LOG_PATH=/app/logs/cron.log
    command: gunicorn -w 3 -t 60 -b 0.0.0.0:8000 app:app
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail http://fogcast-status-reporter:8000/health-check || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
        #networks:
        #- proxy-net

  fogcast-influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: TOKENTOKENTOKEN
      DOCKER_INFLUXDB_INIT_ORG: FogCast
      DOCKER_INFLUXDB_INIT_BUCKET: WeatherForecast
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: TOKEN
    networks:
      - default
# networks:
#  proxy-net:
#    external: true

networks:
  proxy-net:
    external: true